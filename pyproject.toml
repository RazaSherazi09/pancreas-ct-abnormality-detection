[project]
name = "pancreas-ct-abnormality-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RazaSherazi09", email = "183750782+RazaSherazi09@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.2.0",
    "matplotlib>=3.11.2",
    "modal>=1.6.1",
]

[project.scripts]
